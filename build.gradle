plugins {
    id 'java'
    id "org.jetbrains.kotlin.jvm" version "1.5.31"
    id "com.github.johnrengelman.shadow" version "7.0.0"
    id "com.github.breadmoirai.github-release" version "2.2.12"
    id "com.github.ben-manes.versions" version "0.39.0"
}

group = 'atm.bloodworkxgaming'
version = project.hasProperty('releaseVersion') ? project.releaseVersion : '2.4.4'

sourceCompatibility = 1.8

def generatedSrcDir = "$buildDir/generated/source/buildSecrets/kotlin"

sourceSets {
    main {
        kotlin {
            srcDir generatedSrcDir
        }
    }
}

task generateBuildSecrets {
    def outputFile = file("$generatedSrcDir/atm/bloodworkxgaming/serverstarter/BuildSecrets.kt")
    outputs.file(outputFile)
    outputs.upToDateWhen { false }

    doLast {
        def key = getCurseforgeApiKey()
        outputFile.parentFile.mkdirs()
        outputFile.text = """package atm.bloodworkxgaming.serverstarter

// Auto-generated at build time, do not edit or commit. See build.gradle#getCurseforgeApiKey.
object BuildSecrets {
    const val CURSEFORGE_API_KEY: String = "${key}"
}
"""
    }
}

compileKotlin.dependsOn generateBuildSecrets

static String getCurseforgeApiKey() {
    def envKey = System.getenv('CURSEFORGE_API_KEY')
    if (envKey) return envKey

    if (new File('secrets.properties').exists()) {
        Properties props = new Properties()
        props.load(new FileInputStream(new File('secrets.properties')))
        return props['CURSEFORGE_API_KEY'] ?: ""
    }

    return ""
}

repositories {
    mavenCentral()

    maven {
        name = 'DVS1'
        url = 'https://dvs1.progwml6.com/files/maven'
    }
}

dependencies {
    testImplementation  group: 'junit', name: 'junit', version: '4.13.2'
    testImplementation  'com.squareup.okhttp3:mockwebserver:4.9.2'

    implementation  group: 'org.yaml', name: 'snakeyaml', version: '1.29'


    implementation  group: 'commons-io', name: 'commons-io', version: '2.11.0'
    implementation  group: 'org.apache.commons', name: 'commons-compress', version: '1.21'
    implementation  'com.squareup.okhttp3:okhttp:4.9.2'

    implementation  group: 'com.google.code.gson', name: 'gson', version: '2.8.8'

    implementation ("org.jetbrains.kotlin:kotlin-stdlib-jdk8")

    // https://mvnrepository.com/artifact/org.fusesource.jansi/jansi
    implementation  group: 'org.fusesource.jansi', name: 'jansi', version: '2.3.4'
}

shadowJar {
    classifier = ""
}

jar {
    manifest {
        attributes(
                'Class-Path': configurations.runtimeClasspath.collect { it.getName() }.join(' '),
                'Main-Class': 'atm.bloodworkxgaming.serverstarter.ServerStarterKt'
        )
    }
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.build.dependsOn shadowJar


task copyJar(type: Copy) {
    dependsOn build


    from file("$buildDir/libs/serverstarter-${version}.jar")
    into file("$buildDir/dist/serverstarter-$version/")
}

task packageDist(type: Copy) {
    group = "build"
    dependsOn copyJar

    from file("src/main/resources/startserver.bat")
    from file("src/main/resources/startserver.sh")
    from file("server-setup-config.yaml")


    into file("$buildDir/dist/serverstarter-$version/")

    filter { it.replaceAll("@@serverstarter-libVersion@@", version as String) }
}

task zipDist (type: Zip) {
    dependsOn packageDist
    group = "build"

    from file("$buildDir/dist/serverstarter-$version/")
    include '*'
    include '*/**'
    archiveName = "serverstarter-${version}.zip"
    destinationDir = file("$buildDir/release/")
}


githubRelease {
    token { getGithubKey() }
    owner = "BloodWorkXGaming"
    repo = "ServerStarter"
    overwrite = true

    releaseAssets file("$buildDir/release/serverstarter-${version}.zip")
}

tasks.githubRelease.dependsOn zipDist
tasks.githubRelease.doFirst {
    if (!getGithubKey()) {
        throw new GradleException("GITHUB_TOKEN is not set (env var or secrets.properties). Cannot create a GitHub release.")
    }
}

static String getGithubKey() {
    def envKey = System.getenv('GITHUB_TOKEN')
    if (envKey) return envKey

    if (new File('secrets.properties').exists()) {
        Properties props = new Properties()
        props.load(new FileInputStream(new File('secrets.properties')))
        return props['GITHUB_TOKEN'] ?: ""
    }

    return ""
}

task depsize {
    group = "help"
    doLast {
        def size = 0
        def formatStr = "%,10.2f"
        configurations.default.collect { it.length() / (1024 * 1024) }.each { size += it }

        def out = new StringBuffer()
        out << 'Total dependencies size:'.padRight(45)
        out << "${String.format(formatStr, size)} Mb\n\n"

        configurations
                .default
                .sort { -it.length() }
                .each {
            out << "${it.name}".padRight(45)
            out << "${String.format(formatStr, (it.length() / 1024))} kb\n"
        }
        println(out)
    }
}

compileKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}
